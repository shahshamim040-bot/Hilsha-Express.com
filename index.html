<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilsha Express - Super Delivery Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
        
        /* হেডার ও সার্চ বার */
        .header { background: #ff4757; color: white; padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        .search-container { margin-top: 10px; padding: 0 10px; }
        .search-bar { width: 100%; padding: 12px; border-radius: 25px; border: none; font-family: inherit; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 14px; }

        /* ক্যাটাগরি */
        .cat-scroll { display: flex; overflow-x: auto; padding: 10px; gap: 10px; background: white; white-space: nowrap; border-bottom: 1px solid #ddd; }
        .cat-btn { padding: 8px 18px; background: #f1f2f6; border-radius: 20px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; }
        .cat-btn.active { background: #ff4757; color: white; }

        /* ভেন্ডর লিস্ট */
        .vendor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .vendor-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; text-align: center; }
        .vendor-card img { width: 100%; height: 110px; object-fit: cover; background: #eee; }
        .vendor-card h4 { margin: 8px 0; font-size: 14px; padding: 0 5px; }
        
        /* মেনু পেজ */
        .page { display: none; padding-bottom: 90px; }
        .active { display: block; }
        .menu-top { background: white; padding: 15px; position: sticky; top: 0; border-bottom: 2px solid #ff4757; display: flex; align-items: center; gap: 15px; }
        .back-btn { font-size: 24px; cursor: pointer; color: #ff4757; border: none; background: none; }
        
        .item-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; background: white; margin: 5px 10px; border-radius: 10px; }
        .item-info b { display: block; font-size: 15px; }
        .item-info span { color: #ff4757; font-weight: bold; }

        .qty-box { display: flex; align-items: center; background: #f1f2f6; border-radius: 8px; padding: 2px; }
        .q-btn { background: #ff4757; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-size: 18px; }
        .q-val { margin: 0 10px; font-weight: bold; font-size: 14px; }

        /* চেকআউট ও পার্সেল */
        .cart-footer { position: fixed; bottom: 0; width: 100%; background: #2d3436; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .confirm-btn { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        
        .form-card { background: white; padding: 20px; margin: 15px; border-radius: 15px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>

    <div id="home-page" class="page active">
        <div class="header">
            <h2 style="margin:0;">Hilsha Express</h2>
            <div class="search-container">
                <input type="text" id="searchBar" class="search-bar" placeholder="রেস্টুরেন্ট বা সার্ভিস খুঁজুন..." onkeyup="searchVendor()">
            </div>
        </div>

        <div class="cat-scroll">
            <button class="cat-btn active" onclick="filterCat('all')">সবগুলো</button>
            <button class="cat-btn" onclick="filterCat('food')">রেস্টুরেন্ট</button>
            <button class="cat-btn" onclick="filterCat('market')">বাজার ও ঔষধ</button>
            <button class="cat-btn" onclick="filterCat('parcel')">পার্সেল সার্ভিস</button>
        </div>

        <div class="vendor-grid" id="vendorGrid">
            </div>
    </div>

    <div id="menu-page" class="page">
        <div class="menu-top">
            <button class="back-btn" onclick="showPage('home-page')">←</button>
            <h3 id="menuTitle" style="margin:0;">রেস্টুরেন্ট মেনু</h3>
        </div>
        <div id="itemList"></div>
        
        <div class="cart-footer">
            <div>মোট বিল: <span id="totalPrice">0</span>৳</div>
            <button class="confirm-btn" onclick="showPage('order-page')">ঠিকানা দিন ✅</button>
        </div>
    </div>

    <div id="order-page" class="page">
        <div class="menu-top"><button class="back-btn" onclick="showPage('menu-page')">←</button><h3>অর্ডার কনফার্ম করুন</h3></div>
        <div class="form-card" id="addressForm">
            <input type="text" id="custName" placeholder="আপনার নাম">
            <input type="text" id="custAddr" placeholder="পুরো ঠিকানা (বাসা/রোড)">
            <input type="text" id="custMob" placeholder="মোবাইল নম্বর">
            <select id="payMethod"><option value="Cash on Delivery">ক্যাশ অন ডেলিভারি</option><option value="Online">অনলাইন পেমেন্ট</option></select>
            <button class="confirm-btn" style="width:100%; padding:15px; margin-top:10px;" onclick="finalOrder()">হোয়াটসঅ্যাপে অর্ডার পাঠান 🚀</button>
        </div>
    </div>

    <script>
        // সব ভেন্ডর এবং তাদের ক্যাটাগরি
        const vendors = [
            { id: 'v1', name: 'Kacchi Lovers', cat: 'food' },
            { id: 'v2', name: 'Hungry Department', cat: 'food' },
            { id: 'v3', name: 'Recipe Syndicate', cat: 'food' },
            { id: 'v4', name: 'La Chandpur', cat: 'food' },
            { id: 'v5', name: 'Red Chille', cat: 'food' },
            { id: 'v6', name: 'Saiful Vhiyar Dokan', cat: 'food' },
            { id: 'v7', name: 'Sultan Dine', cat: 'food' },
            { id: 'v8', name: 'Kacchi Dine', cat: 'food' },
            { id: 'v9', name: 'Kacchi Dining', cat: 'food' },
            { id: 'v10', name: 'Kalam Beriyani', cat: 'food' },
            { id: 'v11', name: 'Food Zone', cat: 'food' },
            { id: 'v12', name: 'Food Bank', cat: 'food' },
            { id: 'v13', name: 'Hang Out', cat: 'food' },
            { id: 'v14', name: 'Wow Momo', cat: 'food' },
            { id: 'v15', name: 'Juice 35', cat: 'food' },
            { id: 'v16', name: 'Food Lab', cat: 'food' },
            { id: 'v17', name: 'Aroma', cat: 'food' },
            { id: 'v18', name: 'Burger Overload', cat: 'food' },
            { id: 'v19', name: 'মুদি বাজার', cat: 'market' },
            { id: 'v20', name: 'কাঁচা বাজার', cat: 'market' },
            { id: 'v21', name: 'ঔষধ (ফার্মেসী)', cat: 'market' },
            { id: 'v22', name: 'মাছ ও মাংস', cat: 'market' },
            { id: 'v23', name: 'পার্সেল সার্ভিস', cat: 'parcel' }
        ];

        // সব আইটেম (আপনার পাঠানো ছবি অনুযায়ী নির্ভুল ডাটা)
        const allMenus = {
            'v1': [ // Kacchi Lovers (cite: 19369.jpg)
                { n: 'বাসমতি কাচ্চি (২ পিস)', p: 320 }, { n: 'বাসমতি কাচ্চি (১ পিস)', p: 250 }, { n: 'বিফ তেহারী', p: 150 }, { n: 'শাহী মোরগ পোলাও', p: 160 }, { n: 'চিকেন রোস্ট', p: 130 }, { n: 'বোরহানী (১ লিটার)', p: 200 }
            ],
            'v2': [ // Hungry Department (cite: 19501.jpg, 19504.jpg)
                { n: 'চিকেন ফ্রাই (১ পিস)', p: 79 }, { n: 'ক্রিসপি উইংস (৪ পিস)', p: 150 }, { n: 'স্মোকি পিৎজা (৮")', p: 220 }, { n: 'চিকেন চাউমিন', p: 130 }, { n: 'নাচোস (স্পেশাল)', p: 160 }, { n: 'কোল্ড কফি', p: 80 }
            ],
            'v3': [ // Recipe Syndicate (cite: 19503.jpg)
                { n: 'জুনিয়র বার্গার', p: 60 }, { n: 'মিষ্টার মিট বক্স', p: 150 }, { n: 'স্পাইসি চিকেন (৯ পিস)', p: 280 }, { n: 'রেগুলার নাচোস', p: 150 }, { n: 'চিকেন স্যান্ডউইচ', p: 80 }
            ],
            'v4': [ // La Chandpur/Momo (cite: 19505.jpg)
                { n: 'চিকেন মোমো (৬ পিস)', p: 120 }, { n: 'নাগা মোমো (৬ পিস)', p: 140 }, { n: 'ফ্রেঞ্চ ফ্রাই', p: 60 }, { n: 'বিবিকিউ উইংস', p: 160 }
            ],
            'v23': [ // Parcel Service
                { n: 'শহর এলাকা (ডেলিভারি)', p: 50 }, { n: 'উপজেলা এলাকা (ডেলিভারি)', p: 100 }
            ]
            // বাকিগুলোর জন্য ডিফল্ট আইটেম সেট হবে
        };

        let cart = {};
        let currentVendor = null;

        function loadVendors() {
            const grid = document.getElementById('vendorGrid');
            grid.innerHTML = "";
            vendors.forEach(v => {
                grid.innerHTML += `<div class="vendor-card v-item" data-cat="${v.cat}" data-name="${v.name}" onclick="openMenu('${v.id}')">
                    <img src="https://via.placeholder.com/150?text=${v.name}">
                    <h4>${v.name}</h4>
                </div>`;
            });
        }

        function openMenu(id) {
            currentVendor = vendors.find(v => v.id === id);
            document.getElementById('menuTitle').innerText = currentVendor.name;
            const container = document.getElementById('itemList');
            container.innerHTML = "";
            
            const items = allMenus[id] || [{n: 'পণ্য ১', p: 100}, {n: 'পণ্য ২', p: 200}, {n: 'পণ্য ৩', p: 300}];
            
            items.forEach(item => {
                container.innerHTML += `<div class="item-card">
                    <div class="item-info"><b>${item.n}</b><span>${item.p}৳</span></div>
                    <div class="qty-box">
                        <button class="q-btn" onclick="changeQty('${item.n}', ${item.p}, -1)">-</button>
                        <span class="q-val" id="qty-${item.n.replace(/\s+/g, '')}">0</span>
                        <button class="q-btn" onclick="changeQty('${item.n}', ${item.p}, 1)">+</button>
                    </div>
                </div>`;
                cart[item.n] = 0;
            });
            showPage('menu-page');
        }

        function changeQty(name, price, val) {
            const id = name.replace(/\s+/g, '');
            cart[name] = Math.max(0, (cart[name] || 0) + val);
            document.getElementById('qty-'+id).innerText = cart[name];
            updateTotal();
        }

        function updateTotal() {
            let sub = 0;
            const items = allMenus[currentVendor.id] || [];
            for(let name in cart) {
                const item = items.find(i => i.n === name);
                if(item) sub += cart[name] * item.p;
                else if(cart[name] > 0) sub += cart[name] * 100; // Default price
            }
            document.getElementById('totalPrice').innerText = sub > 0 ? sub + 50 : 0;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function searchVendor() {
            let q = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.v-item').forEach(v => {
                v.style.display = v.getAttribute('data-name').toLowerCase().includes(q) ? "block" : "none";
            });
        }

        function filterCat(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.v-item').forEach(v => {
                v.style.display = (cat === 'all' || v.getAttribute('data-cat') === cat) ? "block" : "none";
            });
        }

        function finalOrder() {
            const name = document.getElementById('custName').value;
            const addr = document.getElementById('custAddr').value;
            const mob = document.getElementById('custMob').value;
            if(!name || !addr || !mob) return alert("সব তথ্য দিন!");

            let msg = `🛒 *নতুন অর্ডার - ${currentVendor.name}*\n------------------\n`;
            let has = false;
            for(let n in cart) { if(cart[n] > 0) { msg += `• ${n}: ${cart[n]} টি\n`; has = true; }}
            if(!has) return alert("আইটেম সিলেক্ট করুন!");

            msg += `\n📍 *ডেলিভারি ঠিকানা:*\nনাম: ${name}\nঠিকানা: ${addr}\nমোবাইল: ${mob}\n\n💰 *মোট বিল:* ${document.getElementById('totalPrice').innerText}৳`;
            window.location.href = `https://api.whatsapp.com/send?phone=8801627885003&text=${encodeURIComponent(msg)}`;
        }

        loadVendors();
    </script>
</body>
</html>
